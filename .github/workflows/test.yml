name: Portable tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      ZA_REQUIRE_GUI_TESTS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Size the disposable Windows test desktop
        if: runner.os == 'Windows'
        run: |
          python - <<'PY'
          import ctypes as c
          from ctypes import wintypes as w
          class Mode(c.Structure):
              _fields_ = [
                  ('device', c.c_wchar * 32), ('spec', w.WORD), ('driver', w.WORD),
                  ('size', w.WORD), ('extra', w.WORD), ('fields', w.DWORD),
                  ('x', c.c_int32), ('y', c.c_int32), ('orientation', w.DWORD), ('fixed', w.DWORD),
                  ('color', w.WORD), ('duplex', w.WORD), ('y_resolution', w.WORD),
                  ('tt_option', w.WORD), ('collate', w.WORD), ('form', c.c_wchar * 32),
                  ('dpi', w.WORD), ('bits', w.DWORD), ('width', w.DWORD), ('height', w.DWORD),
                  ('flags', w.DWORD), ('frequency', w.DWORD), ('icm_method', w.DWORD),
                  ('icm_intent', w.DWORD), ('media', w.DWORD), ('dither', w.DWORD),
                  ('reserved1', w.DWORD), ('reserved2', w.DWORD),
                  ('panning_width', w.DWORD), ('panning_height', w.DWORD)]
          assert c.sizeof(Mode) == 220
          user = c.WinDLL('user32', use_last_error=True)
          user.EnumDisplaySettingsW.argtypes = [w.LPCWSTR, w.DWORD, c.POINTER(Mode)]
          user.EnumDisplaySettingsW.restype = w.BOOL
          user.ChangeDisplaySettingsW.argtypes = [c.POINTER(Mode), w.DWORD]
          user.ChangeDisplaySettingsW.restype = c.c_long
          mode = Mode(); mode.size = c.sizeof(Mode)
          assert user.EnumDisplaySettingsW(None, 0xffffffff, c.byref(mode))
          print('original desktop:', mode.width, mode.height)
          if mode.width < 1280 or mode.height < 1024:
              mode.width, mode.height = 1280, 1024
              mode.fields = 0x00080000 | 0x00100000
              # Flags=0 is transient: do not write display settings to registry.
              result = user.ChangeDisplaySettingsW(c.byref(mode), 0)
              assert result == 0, ('test display resize failed', result)
          actual = (user.GetSystemMetrics(0), user.GetSystemMetrics(1))
          assert actual[0] >= 1280 and actual[1] >= 1024, actual
          print('test desktop:', actual)
          PY
      - name: Record native release-input metadata
        run: |
          python - <<'PY'
          import hashlib, json, os, platform, subprocess, sys
          from pathlib import Path
          fields = ('st_dev', 'st_ino', 'st_size', 'st_mtime_ns', 'st_ctime_ns',
                    'st_mode', 'st_birthtime_ns', 'st_file_attributes', 'st_reparse_tag')
          print(sys.version, platform.platform())
          print('checkout autocrlf:', subprocess.run(
              ['git', 'config', '--get', 'core.autocrlf'], capture_output=True,
              text=True).stdout.strip() or 'unset')
          data = Path('zasim/data/ui_names.json').read_bytes()
          provenance = json.loads(Path('zasim/data/ui_names_provenance.json').read_text(encoding='utf-8'))
          assert hashlib.sha256(data).hexdigest() == provenance['data_sha256'], 'checkout changed catalog bytes'
          if os.name == 'nt':
              import ctypes
              print('desktop pixels:', ctypes.windll.user32.GetSystemMetrics(0), ctypes.windll.user32.GetSystemMetrics(1))
              filesystem = ctypes.create_unicode_buffer(256)
              if not ctypes.windll.kernel32.GetVolumeInformationW(
                  str(Path.cwd().anchor), None, 0, None, None, None, filesystem, len(filesystem)):
                  raise ctypes.WinError()
              print('filesystem:', filesystem.value)
          for name in ('.editorconfig', 'Start-za-ldn-trade.cmd'):
              with open(name, 'rb') as stream:
                  path_stat, fd_stat = Path(name).lstat(), os.fstat(stream.fileno())
                  print(json.dumps({'path': name, 'lstat': {f: getattr(path_stat, f, None) for f in fields},
                                    'fstat': {f: getattr(fd_stat, f, None) for f in fields}}))
          PY
      - name: Export only reviewed public inputs
        run: python -B scripts/export_za_source.py --output "$RUNNER_TEMP/za-public"
      - name: Install product test dependencies
        run: python -m pip install "$RUNNER_TEMP/za-public[test]" build
      - name: Exercise the optional Linux dependency path
        if: runner.os == 'Linux' && matrix.python != '3.10'
        run: |
          python -m pip install "$RUNNER_TEMP/za-public[live]"
          python -c 'import ldn, trio; print("Pinned live imports available; no radio operations")'
      - name: Linux Tk display and read-only kmod version checks
        if: runner.os == 'Linux'
        # Japanese UI geometry must use actual CJK glyphs, not narrow tofu.
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk kmod fonts-noto-cjk
      - name: Verify release tag matches source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd "$RUNNER_TEMP/za-public"
          python -c 'import os, zasim; assert os.environ["GITHUB_REF_NAME"] == "v" + zasim.__version__'
      - name: Linux product tests
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP/za-public"
          xvfb-run -a python -m pytest -v --tb=short -rs --durations=10 -o faulthandler_timeout=60 -o faulthandler_exit_on_timeout=true -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning
      - name: Windows product tests
        if: runner.os == 'Windows'
        run: |
          cd "$RUNNER_TEMP/za-public"
          python -m pytest -v --tb=short -rs --durations=10 -o faulthandler_timeout=60 -o faulthandler_exit_on_timeout=true -W error::ResourceWarning -W error::pytest.PytestUnraisableExceptionWarning
      - name: Build and verify finalized artifacts
        run: |
          cd "$RUNNER_TEMP/za-public"
          python -m build --outdir "$RUNNER_TEMP/za-dist"
          python -B scripts/normalize_za_artifacts.py --directory "$RUNNER_TEMP/za-dist"
          python -B scripts/build_za_release.py --output "$RUNNER_TEMP/za-dist"
          python -B scripts/check_za_release.py --directory "$RUNNER_TEMP/za-dist" --write-checksums
      - name: Exact wheel CLI and GUI outside source
        run: |
          python -m venv "$RUNNER_TEMP/za-install"
          if [ "$RUNNER_OS" = Windows ]; then
            PY="$RUNNER_TEMP/za-install/Scripts/python.exe"
          else
            PY="$RUNNER_TEMP/za-install/bin/python"
          fi
          "$PY" -m pip install "$RUNNER_TEMP"/za-dist/*.whl
          "$PY" -m pip check
          VERSION=$(python -c 'import zasim; print(zasim.__version__)')
          cp "$RUNNER_TEMP/za-public/scripts/smoke_installed.py" "$RUNNER_TEMP/smoke_installed.py"
          cd "$RUNNER_TEMP"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a "$PY" -I -B smoke_installed.py --expected-version "$VERSION" --gui
          else
            "$PY" -I -B smoke_installed.py --expected-version "$VERSION" --gui
          fi
